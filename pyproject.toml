[project]
name = "materials-studio-mcp"
version = "0.2.0"
description = "FastMCP tools for reproducible Materials Studio modeling, live GUI synchronization, and semiconductor diagnostics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "mcp[cli]>=1.12.4",
  "pydantic>=2.7",
  "pywinauto>=0.6.9; sys_platform == 'win32'",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.22",
  "pytest>=8",
]

[project.scripts]
ms-mcp = "material_studio_mcp_server.server:main"
ms-mcp-legacy = "ms_mcp.server:main"
ms-mcp-live-smoke = "material_studio_mcp_server.live_smoke:main"
ms-mcp-protocol-smoke = "material_studio_mcp_server.protocol_smoke:main"
ms-mcp-config-doctor = "material_studio_mcp_server.codex_config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/material_studio_mcp_server", "src/ms_mcp"]

[tool.hatch.build]
include = [
  "src/material_studio_mcp_server/**/*.py",
  "src/material_studio_mcp_server/**/*.json",
  "src/ms_mcp/**/*.py",
  "src/ms_mcp/templates/**/*.j2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
