[project]
name = "materials-studio-mcp"
version = "0.5.1"
description = "FastMCP tools for reproducible Materials Studio modeling, live GUI synchronization, and semiconductor diagnostics."
readme = "README.md"
authors = [
  { name = "Xu kaidong" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "jinja2>=3.1",
  "mcp[cli]>=1.12.4,<2",
  "packaging>=24",
  "pydantic>=2.7",
  "comtypes==1.4.16; sys_platform == 'win32'",
  "pywinauto==0.6.9; sys_platform == 'win32'",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Wqeeeeeeee/ms_mcp#readme"
Repository = "https://github.com/Wqeeeeeeee/ms_mcp"
Issues = "https://github.com/Wqeeeeeeee/ms_mcp/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
]

[project.scripts]
ms-mcp = "material_studio_mcp_server.server:main"
ms-mcp-legacy = "ms_mcp.server:main"
ms-mcp-live-smoke = "material_studio_mcp_server.live_smoke:main"
ms-mcp-protocol-smoke = "material_studio_mcp_server.protocol_smoke:main"
ms-mcp-config-doctor = "material_studio_mcp_server.codex_config:main"
ms-mcp-config-register = "material_studio_mcp_server.codex_registration:main"
ms-mcp-runtime-deploy = "material_studio_mcp_server.runtime_deployment:main"
ms-mcp-dashboard = "material_studio_mcp_server.read_only_dashboard:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/material_studio_mcp_server", "src/ms_mcp"]

[tool.hatch.build]
include = [
  "src/material_studio_mcp_server/**/*.py",
  "src/material_studio_mcp_server/**/*.json",
  "src/ms_mcp/**/*.py",
  "src/ms_mcp/templates/**/*.j2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
